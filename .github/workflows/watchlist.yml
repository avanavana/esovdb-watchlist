name: ESOVDB Watchlist Runner

on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
    inputs:
      watchlistRecordId:
        description: Airtable Watchlist record ID to process (optional)
        required: false
        type: string
      watchlistRunTriggerSource:
        description: Internal trigger source for API-requested real runs
        required: false
        type: string
      smartFilterDryRun:
        description: Run smart filtering only and print results without writing Airtable records
        required: false
        type: boolean
        default: false
      smartFilterDryRunId:
        description: Internal dry-run result ID for API-requested dry runs
        required: false
        type: string
      smartFilterExcludeThreshold:
        description: Optional dry-run exclude threshold override, 0.0 to 1.0
        required: false
        type: string
      smartFilterAutoIncludeThreshold:
        description: Optional dry-run auto-include threshold override, 0.0 to 1.0
        required: false
        type: string
      smartFilterCandidateLimit:
        description: Optional dry-run limit for number of candidate videos to classify
        required: false
        type: string
      smartFilterSourcePrompt:
        description: Optional dry-run source prompt override
        required: false
        type: string

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Run watchlist
        id: watchlist
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.smartFilterDryRun }}
        run: node dist/index.js
        env:
          ESOVDB_API_BASE_URL: ${{ vars.ESOVDB_API_BASE_URL }}
          ESOVDB_KEY: ${{ secrets.ESOVDB_KEY }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ vars.AIRTABLE_BASE_ID }}
          AIRTABLE_ADMIN_BASE_ID: ${{ vars.AIRTABLE_ADMIN_BASE_ID }}
          AIRTABLE_WATCHLIST_TABLE: ${{ vars.AIRTABLE_WATCHLIST_TABLE }}
          AIRTABLE_SUBMISSIONS_TABLE: ${{ vars.AIRTABLE_SUBMISSIONS_TABLE }}
          AIRTABLE_WATCHLIST_RUNS_TABLE: ${{ vars.AIRTABLE_WATCHLIST_RUNS_TABLE }}
          AIRTABLE_WATCHLIST_CANDIDATES_TABLE: ${{ vars.AIRTABLE_WATCHLIST_CANDIDATES_TABLE }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SMART_FILTER_MODEL: ${{ vars.SMART_FILTER_MODEL }}
          SMART_FILTER_CONFIG_PATH: ${{ vars.SMART_FILTER_CONFIG_PATH }}
          WATCHLIST_RECORD_ID: ${{ github.event.inputs.watchlistRecordId }}
          WATCHLIST_RUN_TRIGGER_SOURCE: ${{ github.event.inputs.watchlistRunTriggerSource }}
          WATCHLIST_DISCORD_NOTIFY_PATH: ${{ vars.WATCHLIST_DISCORD_NOTIFY_PATH }}
      - name: Dry run smart filter
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.smartFilterDryRun }}
        run: pnpm run smart-filter:dry-run
        env:
          ESOVDB_API_BASE_URL: ${{ vars.ESOVDB_API_BASE_URL }}
          ESOVDB_KEY: ${{ secrets.ESOVDB_KEY }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ vars.AIRTABLE_BASE_ID }}
          AIRTABLE_ADMIN_BASE_ID: ${{ vars.AIRTABLE_ADMIN_BASE_ID }}
          AIRTABLE_WATCHLIST_TABLE: ${{ vars.AIRTABLE_WATCHLIST_TABLE }}
          AIRTABLE_SUBMISSIONS_TABLE: ${{ vars.AIRTABLE_SUBMISSIONS_TABLE }}
          AIRTABLE_WATCHLIST_RUNS_TABLE: ${{ vars.AIRTABLE_WATCHLIST_RUNS_TABLE }}
          AIRTABLE_WATCHLIST_CANDIDATES_TABLE: ${{ vars.AIRTABLE_WATCHLIST_CANDIDATES_TABLE }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SMART_FILTER_MODEL: ${{ vars.SMART_FILTER_MODEL }}
          SMART_FILTER_CONFIG_PATH: ${{ vars.SMART_FILTER_CONFIG_PATH }}
          WATCHLIST_RECORD_ID: ${{ github.event.inputs.watchlistRecordId }}
          SMART_FILTER_DRY_RUN_ID: ${{ github.event.inputs.smartFilterDryRunId }}
          SMART_FILTER_DRY_RUN_EXCLUDE_THRESHOLD: ${{ github.event.inputs.smartFilterExcludeThreshold }}
          SMART_FILTER_DRY_RUN_AUTO_INCLUDE_THRESHOLD: ${{ github.event.inputs.smartFilterAutoIncludeThreshold }}
          SMART_FILTER_DRY_RUN_CANDIDATE_LIMIT: ${{ github.event.inputs.smartFilterCandidateLimit }}
          SMART_FILTER_DRY_RUN_SOURCE_PROMPT: ${{ github.event.inputs.smartFilterSourcePrompt }}
          WATCHLIST_DISCORD_NOTIFY_PATH: ${{ vars.WATCHLIST_DISCORD_NOTIFY_PATH }}
      - name: Update automated maintenance date
        if: ${{ success() && github.event_name == 'schedule' && steps.watchlist.outcome == 'success' }}
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          git merge --ff-only FETCH_HEAD

          test "$(grep -c '^\*\*Last successful automated update:\*\* ' README.md)" -eq 1
          last_updated="$(sed -n 's/^\*\*Last successful automated update:\*\* \([0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}\)$/\1/p' README.md)"
          last_updated_seconds="$(date -u -d "$last_updated" +%s)"
          test "$(date -u -d "$last_updated" +%F)" = "$last_updated"
          today="$(date -u +%F)"
          today_seconds="$(date -u -d "$today" +%s)"

          if (( today_seconds - last_updated_seconds < 30 * 86400 )); then
            echo "Automated maintenance is not due."
            exit 0
          fi

          sed -i "s/^\(\*\*Last successful automated update:\*\* \)$last_updated$/\1$today/" README.md
          if git diff --quiet -- README.md; then
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md
          git commit --only -m "chore: update automated maintenance date to $today" -- README.md
          git -c push.followTags=false push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
